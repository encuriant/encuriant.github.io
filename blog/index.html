<script>
  function filterPosts() {
    const selectedTag = document.getElementById('tag-filter').value.toLowerCase();
    const sections = document.querySelectorAll('.tag-section');

    // Hide or show entire sections based on the selected tag
    sections.forEach(section => {
      const sectionTag = section.getAttribute('data-section-tag');
      if (selectedTag === "all" || sectionTag === selectedTag) {
        section.style.display = "block";
      } else {
        section.style.display = "none";
      }
    });

    // Update the URL silently so if they hit "Back", the filter remains
    const url = new URL(window.location);
    if (selectedTag === "all") {
      url.searchParams.delete('tag');
    } else {
      url.searchParams.set('tag', selectedTag);
    }
    window.history.replaceState({}, '', url);
  }

  // On page load, check if the URL already has a tag filter active
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const tagFromUrl = urlParams.get('tag');
    if (tagFromUrl) {
      const select = document.getElementById('tag-filter');
      for(let i = 0; i < select.options.length; i++) {
        if(select.options[i].value.toLowerCase() === tagFromUrl.toLowerCase()) {
          select.selectedIndex = i;
          break;
        }
      }
      filterPosts(); // Run the filter immediately
    }
  };
</script>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    const themeToggleButton = document.getElementById('theme-toggle-button');
    const themeToggleIcon = document.getElementById('theme-toggle-icon');  // New: select the icon
    const body = document.documentElement;    
    const currentTheme = localStorage.getItem('theme');

    console.log('DOMContentLoaded fired');
    console.log('themeToggleButton:', themeToggleButton);
    console.log('body:', body);
    console.log('currentTheme:', currentTheme);

   //  Define disqus_config globally or within a scope accessible by DISQUS.reset
   //  A more robust way is to make it a named function or a property of window
   //  so DISQUS.reset can find it.
   // so DISQUS.reset can find it.
    window.disqus_config = function () {
  this.page.url = 'http://localhost:4001/blog/';
      this.page.identifier = 'http://localhost:4001/blog/';

      // FIX: Define the variable actually used in the if-statement below
      // var currentThemeForDisqus = localStorage.getItem('theme') || 'dark';
      var currentThemeForDisqus = document.documentElement.getAttribute('data-theme') || 'dark';
      if (currentThemeForDisqus === 'light') {
        this.page.display_thread_theme = 'light';
      } else {
        this.page.display_thread_theme = 'dark';
      }
    };

    
    const initializeTheme = () => {
      const savedTheme = localStorage.getItem('theme') || 'dark'; // Default to dark
      body.setAttribute('data-theme', savedTheme);

      if (savedTheme === 'light') {
        themeToggleIcon.classList.replace('fa-sun', 'fa-moon');
      } else {
        themeToggleIcon.classList.replace('fa-moon', 'fa-sun');
      }
    };

    /**
     * 3. Handle Theme Toggle Click
     */
    if (themeToggleButton) {
      themeToggleButton.addEventListener('click', function() {
        const isDark = body.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';

        // Update Site UI
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);

        // Update Icons
        if (newTheme === 'light') {
          themeToggleIcon.classList.replace('fa-sun', 'fa-moon');
        } else {
          themeToggleIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // --- DISQUS THEME RESET ---
        // This forces Disqus to re-read window.disqus_config
        if (typeof DISQUS !== 'undefined') {
          DISQUS.reset({
            reload: true,
            config: function () {
              // We call the global config using the context of the reset
              window.disqus_config.call(this);
              this.page.display_thread_theme = newTheme; // <--- Add this line
            }
          });
          console.log('Disqus theme synchronized to: ' + newTheme);
        }
      

      });

    }

    if (document.readyState === 'loading') {
      document.addEventListener('readystatechange', function() {
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
          initializeTheme();
        }
      });
      console.log('readyState is loading, adding readystatechange listener');
    } else {
      initializeTheme();
      console.log('readyState is not loading, calling initializeTheme directly');
    }
  });
</script>
