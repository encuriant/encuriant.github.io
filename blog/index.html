<div id="blog-sections">

<script>
  function filterPosts() {
    const selectedTag = document.getElementById('tag-filter').value.toLowerCase();
    const sections = document.querySelectorAll('.tag-section');

    // Hide or show entire sections based on the selected tag
    sections.forEach(section => {
      const sectionTag = section.getAttribute('data-section-tag');
      if (selectedTag === "all" || sectionTag === selectedTag) {
        section.style.display = "block";
      } else {
        section.style.display = "none";
      }
    });

    // Update the URL silently so if they hit "Back", the filter remains
    const url = new URL(window.location);
    if (selectedTag === "all") {
      url.searchParams.delete('tag');
    } else {
      url.searchParams.set('tag', selectedTag);
    }
    window.history.replaceState({}, '', url);
  }

  // On page load, check if the URL already has a tag filter active
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const tagFromUrl = urlParams.get('tag');
    if (tagFromUrl) {
      const select = document.getElementById('tag-filter');
      for(let i = 0; i < select.options.length; i++) {
        if(select.options[i].value.toLowerCase() === tagFromUrl.toLowerCase()) {
          select.selectedIndex = i;
          break;
        }
      }
      filterPosts(); // Run the filter immediately
    }
  };
</script>

    <!-- Global Font Controls -->
<div id="font-controls">
  <button id="btn-decrease-font">A-</button>
  <button id="btn-increase-font">A+</button>
</div>


<script>
document.addEventListener('DOMContentLoaded', function() {
  const btnIncrease = document.getElementById('btn-increase-font');
  const btnDecrease = document.getElementById('btn-decrease-font');
  
  if (btnIncrease && btnDecrease) {
    let currentZoom = 1.0;
    
    const fontStyleSheet = document.createElement('style');
    document.head.appendChild(fontStyleSheet);

    function updateFontSize() {
      // 1. Main blog text (Default: 17px)
      const pSize = Math.round(17 * currentZoom);
      const pLine = Math.round(25 * currentZoom);
      
      // 2. Main Headings (Defaults: H1=24px, H2=22px, H3=20px)
      const h1Size = Math.round(24 * currentZoom);
      const h1Line = Math.round(35 * currentZoom);
      const h2Size = Math.round(22 * currentZoom);
      const h2Line = Math.round(35 * currentZoom);
      const h3Size = Math.round(20 * currentZoom);
      const h3Line = Math.round(30 * currentZoom); 

      // 3. Custom Section Headings (Defaults: Subhead=20px, Subsubhead/TOC=14px)
      const subheadSize = Math.round(20 * currentZoom);
      const subsubheadSize = Math.round(14 * currentZoom);
      
      // 4. Book titles (Default: 15px)
      const titleSize = Math.round(15 * currentZoom);
      const titleLine = Math.round(18 * currentZoom);

      // 5. Descriptions & Blurbs (Default: 14px)
      const descSize = Math.round(14 * currentZoom);
      const descLine = Math.round(20 * currentZoom);
      
      // 6. Notes, Tooltips, & Authors (Default: 13px)
      const noteSize = Math.round(13 * currentZoom);
      const noteLine = Math.round(18 * currentZoom);
      
      fontStyleSheet.innerHTML = `
        /* Main Blog Text */
        .blogbody p, .blogbody li {
          font-size: ${pSize}px !important;
          line-height: ${pLine}px !important;
        }

        /* Standard Blog Headings */
        .blogbody h1 { font-size: ${h1Size}px !important; line-height: ${h1Line}px !important; }
        .blogbody h2 { font-size: ${h2Size}px !important; line-height: ${h2Line}px !important; }
        .blogbody h3 { font-size: ${h3Size}px !important; line-height: ${h3Line}px !important; }

        /* Custom Library & Index Headings */
        .subheading { font-size: ${subheadSize}px !important; }
        .subsubheading, .toc-category-title { font-size: ${subsubheadSize}px !important; }
        
        /* Book Titles */
        .book-title {
          font-size: ${titleSize}px !important;
          line-height: ${titleLine}px !important;
        }

        /* Library Descriptions & Blurb Clouds */
        .toc-category-description, .book-blurb-cloud p {
          font-size: ${descSize}px !important;
          line-height: ${descLine}px !important;
        }

        /* Marginalia, Tooltips, and Author Names */
        .marginnote, .marginnote p, .tooltip p, .book-author {
          font-size: ${noteSize}px !important;
          line-height: ${noteLine}px !important;
        }
      `;
    }

    btnIncrease.addEventListener('click', () => {
      if (currentZoom < 1.4) { 
        currentZoom += 0.1;
        updateFontSize();
      }
    });

    btnDecrease.addEventListener('click', () => {
      if (currentZoom > 0.8) { 
        currentZoom -= 0.1;
        updateFontSize();
      }
    });
  }
});
</script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 1. Find all marks and all notes in the exact order they appear on the page
    const marks = document.querySelectorAll('.sidenote-mark');
    const notes = document.querySelectorAll('.marginnote');

    // 2. Pair them up by their sequence number
    marks.forEach((mark, index) => {
      mark.addEventListener('click', function(e) {
        
        // Find the specific note that shares this mark's index (e.g., Mark #3 opens Note #3)
        const note = notes[index];
        
        if (note && note.classList.contains('marginnote')) {
          note.classList.toggle('revealed');
        } 
      });
    });
  });
</script>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function() {
    const themeToggleButton = document.getElementById('theme-toggle-button');
    const themeToggleIcon = document.getElementById('theme-toggle-icon');  // New: select the icon
    const body = document.documentElement;    
    const currentTheme = localStorage.getItem('theme');

    console.log('DOMContentLoaded fired');
    console.log('themeToggleButton:', themeToggleButton);
    console.log('body:', body);
    console.log('currentTheme:', currentTheme);

   //  Define disqus_config globally or within a scope accessible by DISQUS.reset
   //  A more robust way is to make it a named function or a property of window
   //  so DISQUS.reset can find it.
   // so DISQUS.reset can find it.
    window.disqus_config = function () {
  this.page.url = 'http://localhost:4001/blog/';
      this.page.identifier = 'http://localhost:4001/blog/';

      // FIX: Define the variable actually used in the if-statement below
      // var currentThemeForDisqus = localStorage.getItem('theme') || 'dark';
      var currentThemeForDisqus = document.documentElement.getAttribute('data-theme') || 'dark';
      if (currentThemeForDisqus === 'light') {
        this.page.display_thread_theme = 'light';
      } else {
        this.page.display_thread_theme = 'dark';
      }
    };

    
    const initializeTheme = () => {
      const savedTheme = localStorage.getItem('theme') || 'dark'; // Default to dark
      body.setAttribute('data-theme', savedTheme);

      if (savedTheme === 'light') {
        themeToggleIcon.classList.replace('fa-sun', 'fa-moon');
      } else {
        themeToggleIcon.classList.replace('fa-moon', 'fa-sun');
      }
    };

    /**
     * 3. Handle Theme Toggle Click
     */
    if (themeToggleButton) {
      themeToggleButton.addEventListener('click', function() {
        const isDark = body.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';

        // Update Site UI
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);

        // Update Icons
        if (newTheme === 'light') {
          themeToggleIcon.classList.replace('fa-sun', 'fa-moon');
        } else {
          themeToggleIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // --- DISQUS THEME RESET ---
        // This forces Disqus to re-read window.disqus_config
        if (typeof DISQUS !== 'undefined') {
          DISQUS.reset({
            reload: true,
            config: function () {
              // We call the global config using the context of the reset
              window.disqus_config.call(this);
              this.page.display_thread_theme = newTheme; // <--- Add this line
            }
          });
          console.log('Disqus theme synchronized to: ' + newTheme);
        }
      

      });

    }

    if (document.readyState === 'loading') {
      document.addEventListener('readystatechange', function() {
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
          initializeTheme();
        }
      });
      console.log('readyState is loading, adding readystatechange listener');
    } else {
      initializeTheme();
      console.log('readyState is not loading, calling initializeTheme directly');
    }
  });
</script>
